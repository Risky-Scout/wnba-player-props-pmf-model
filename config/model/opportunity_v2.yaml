version: opportunity_v2_v1
random_seed: 42

default_lead_minutes: 90
strict_mode: true
market_inputs_allowed: false

availability:
  enabled: true
  max_snapshot_age_hours: 168
  min_probability: 0.001
  max_probability: 0.999

lineup:
  enabled: true
  max_snapshot_age_hours: 48
  allow_minutes_proxy_labels: false
  proxy_label_weight: 0.25

minutes:
  conditional_on_active: true
  quantiles: [0.05, 0.10, 0.25, 0.50, 0.75, 0.90, 0.95]
  deterministic_samples: 21
  minimum_minutes: 0.5
  maximum_minutes: 60.0
  enforce_reported_cap: true

history:
  ewma_halflife_games: 6.0
  recent_windows: [3, 5, 10, 20]
  minimum_history_games: 3

team_environment:
  targets:
    - possessions
    - fga
    - fg3a
    - fta
    - fg_misses
    - turnovers
    - rim_attempts
    - potential_assists
    - rebound_chances
    - touches
  reconcile_possessions: true

shares:
  epsilon: 0.000001
  normalize_within_team: true
  active_probability_weighted: true

conversion:
  hierarchy:
    - [position]
    - [role_bucket]
    - [position, role_bucket]
    - [team_id, role_bucket]
    - [player_id]
  prior_strength:
    fg2: 75.0
    fg3: 125.0
    ft: 75.0
    ast: 50.0
    reb: 50.0
    turnover: 100.0
    steal: 100.0
    block: 100.0

pmf:
  tail_tolerance: 0.00000001
  maximum_support: 120
  normalization_tolerance: 0.000000000001
  use_active_pmf_for_sportsbook: true

data_tiers:
  require_tier2_for:
    - ast
    - reb
  allow_tier1_diagnostic_fallback: true

# Frozen promotion / market-superiority contract. The evaluator loads these and
# MUST NOT hard-code a weaker standard. A candidate may be selection-eligible only
# when it satisfies BOTH the log-loss and Brier families under Holm correction.
promotion:
  required_rows: 300
  required_dates: 30
  holm_alpha: 0.05
  # frozen AUC rule: candidate AUC must be strictly above chance and not worse
  # than the market AUC beyond this tolerance.
  auc_min: 0.5
  auc_vs_market_tol: 0.0
  # calibration gates (logistic re-fit of outcome on logit(p))
  calibration_slope_min: 0.80
  calibration_slope_max: 1.25
  calibration_intercept_abs_max: 0.25
  ece_max: 0.05
  bootstrap_iters: 10000
  bootstrap_seed: 42
  # Full-PMF certification gates (frozen). A candidate's discrete predictive distribution must be
  # proper, well-supported, calibrated and informative — not merely finite. Each gate can
  # independently fail a candidate (see tests/opportunity/test_full_pmf_gates.py).
  full_pmf_log_score_max: 2.5          # absolute cap when no reference log-score supplied
  crps_max: 1.5                        # absolute cap when no reference CRPS supplied
  full_pmf_log_score_noninferiority_tol: 0.05   # candidate <= reference + tol
  crps_noninferiority_tol: 0.05                 # candidate <= reference + tol
  tail_bin_mass_max: 0.02              # max mass allowed to pile on the final support bin (truncation)
  out_of_support_frac_max: 0.01        # max fraction of realized counts beyond the PMF support
  coverage_tol_50: 0.12                # |empirical central-50% coverage - 0.50| bound
  coverage_tol_90: 0.08                # |empirical central-90% coverage - 0.90| bound
  sharpness_max_width_90: 60.0         # mean central-90% interval width must be finite, >0, and <= this

# Honest scope on current repository data (see artifacts/opportunity_v2/DATA_AVAILABILITY_AUDIT.json):
# only Tier-0 box props are historically certifiable. Tier-2 props are disabled until a tracking
# source and historical pregame availability/lineup snapshots exist.
enabled_props_tier0:
  - fg3m
  - pts

oof:
  validation_window_days: 7
  strict_baseline: true
  checkpoint_each_fold: true
  fail_on_fallback: true
  fail_on_null_pmf: true

evaluation:
  bootstrap_cluster: game_date
  bootstrap_iterations: 10000
  minimum_rows: 300
  minimum_dates: 30
  holm_correction: true
