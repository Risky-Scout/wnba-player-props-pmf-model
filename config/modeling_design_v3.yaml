# Modeling Design V3 — WNBA Sharp PMF (frozen before any outer-fold prediction)
# V2 is preserved unmodified in config/design_registry/v2_archive/. Do not edit this file after
# the first outer prediction; a semantic change requires quarantining V3 predictions and freezing V4.
version: v3
release: wnba-sharp-pmf-v3

corrections_over_v2:
  1_tracks: "PURE and MARKET_ANCHORED are separate tracks; sportsbook data never enters PURE."
  2_feature_contracts: "stat-specific compact contracts (domain core + inner-fold stable extensions + full-matrix control)."
  3_structural_primitives: "model 2PA/3PA/FTA x conversion; points/fgm/reb derived by identity, not generic counts."
  4_role_state_minutes: "minutes via role-state mixture, not one clipped normal."
  5_game_shared_latent: "per-game shared latent (pace/possessions/overtime/script) allocated to players."
  6_tail_precision: "analytic tails; tail_tolerance 1e-6; explicit overflow atom; MC error <=5e-4 per line."
  7_untouched_holdout: "2026 season-to-date is opened exactly once, after candidates lock."
  8_active_conditional: "p_active separate from P(stat=k|active); DNP never adds Under mass."
  9_distributional_calibration: "monotone CDF/PIT recalibration cross-fitted on earlier OOF only."
  10_conservative_fallback: "abstain or market-fallback under OOD / missing critical inputs."

inputs:
  features: data/recovered_v2/modeling/wnba_pregame_features_t12.parquet   # 23931 x 336, pregame T-1.2
  targets:  data/recovered_v2/modeling/wnba_player_targets.parquet          # participation, minutes, Tier A stats
  market:   data/atomic_quotes/settled_quote_pairs.parquet                  # exact same-time no-vig pairs
  private_manifest: artifacts/sharp_v3/PRIVATE_INPUT_MANIFEST.json          # fail-closed hash check

id_and_date_keys: [game_id, player_id, game_date, season, team_id, opponent_team_id]

targets_tier_A: [pts, reb, ast, fg3m, stl, blk, turnover]           # fitted + evaluated first
derived_tier_A: [stocks, pts_ast, pts_reb, reb_ast, pts_reb_ast]    # from joint distribution
tier_B: [fgm, ftm, fta, pts_q1, reb_q1, ast_q1, double_double, triple_double, fantasy_points]
tier_C: [first_basket, first_team_basket, method_of_first_basket]

participation:
  candidates: [hgb_classifier_prior_corrected, logistic_l2_partial_pool]
  primary_metric: log_loss
  calibration: isotonic_oof   # cross-fitted, no identity fallback, no fillna(0.5)
  forbid: [class_weight_balanced_as_probability]

minutes_conditional_on_active:
  candidates: [hierarchical_empirical_shrunk, quantile_hgb_monotone]
  support: [0, 48]
  metrics: [crps, nll, mae, rmse, coverage_50_80_95, pit]

direct_stats:
  structural: {pts: from_shot_components, fgm: identity_2pm_3pm, reb: oreb_plus_dreb}
  count_candidates: [poisson_control, nb2, poisson_lognormal_via_nb2]
  rare_events: {stl: hurdle_nb2, blk: hurdle_nb2, turnover: nb2}
  threes: attempt_x_conversion_beta_binomial
  dispersion: "fit inside training fold; hierarchical shrink player->role->stat->league; frozen before outer results."
  integrate_over_minutes: true   # use OOF-predicted minutes PMF, never actual minutes

joint_dependence:
  candidates: [conditional_independence_convolution, shared_latent_simulation, gaussian_copula_residual]
  precision: {max_line_abs_error: 5.0e-4, replicate_tv_error: 1.0e-3, seed: 20260730}

calibration:
  method: monotone_cdf_pit_recalibration
  cross_fit: earlier_oof_only
  insufficient_data: {pure: ABSTAIN_MISSING_CALIBRATOR, market: use_market_consistent_pmf}

market_anchored:
  input: exact_same_time_no_vig_only
  projection: min_kl_exponential_tilt_to_no_vig
  residual: hierarchical_shrink_then_optional_boost
  fallback: delta_zero_market_consistent

selection_gates_ref: config/model_selection_gates_v3.yaml
oof_protocol_ref: config/chronological_oof_v3.yaml
pmf_support_ref: config/pmf_support_v3.yaml
seed: 20260730
