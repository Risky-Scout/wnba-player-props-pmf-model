name: Release WNBA Pricing PMF v1

# Post-merge release. The final tag is created ONLY after this workflow runs on main
# (never before merge). Manual dispatch or push of the release bundle on main.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type CREATE to cut the v1.0.0 tag + GitHub release"
        required: true
        default: "no"

permissions:
  contents: write

jobs:
  release:
    if: ${{ github.ref == 'refs/heads/main' && github.event.inputs.confirm == 'CREATE' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify release-candidate bundle present
        run: |
          test -f artifacts/releases/wnba-pricing-pmf-v1.0.0-rc1/MANIFEST.json
          test -f artifacts/releases/wnba-pricing-pmf-v1.0.0-rc1/SHA256SUMS
      - name: Create tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag wnba-pricing-pmf-v1.0.0
          git push origin wnba-pricing-pmf-v1.0.0
          gh release create wnba-pricing-pmf-v1.0.0 \
            --title "WNBA Pricing PMF v1.0.0" \
            --notes-file artifacts/releases/wnba-pricing-pmf-v1.0.0-rc1/MODEL_CARD.md
