name: Forward Availability Accrual (Path A)

# Path A — accrue a PRE-TIP player-availability archive going forward. Pulls BDL
# player_injuries (current-state) + tonight's WNBA games, stamps them AS PULLED NOW, and
# appends an idempotent snapshot. There is no historical pregame-availability archive to
# backfill from, so the vacated-opportunity feature (src/wnba_props_model/data/
# vacated_opportunity.py) can only be evaluated on data this collector accrues over time.
#
# Runs a few times through the afternoon/evening ET window so the availability picture is
# captured before AND close to first tip. FAIL-OPEN: no key / no games / no injuries is a
# clean no-op. Raw snapshots live under the gitignored data/ dir and are uploaded as
# durable workflow artifacts (never committed to git).
#
# REQUIRED secret IN THIS repository's Actions secrets:
#   BDL_API_KEY   Ball Don't Lie (GOAT tier)

on:
  workflow_dispatch:
    inputs:
      date:
        description: "Target date YYYY-MM-DD (default: today UTC)"
        required: false
        default: ""
  schedule:
    - cron: "0 15 * * *"   # ~11:00 ET  early availability
    - cron: "0 19 * * *"   # ~15:00 ET  injury-update
    - cron: "0 22 * * *"   # ~18:00 ET  near first tip

concurrency:
  group: collect-availability
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BDL_API_KEY: ${{ secrets.BDL_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Resolve target date
        id: d
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            echo "date=${{ github.event.inputs.date }}" >> "$GITHUB_OUTPUT"
          else
            echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
          fi

      - name: Warn (not fail) if BDL_API_KEY is missing
        run: |
          if [ -z "$BDL_API_KEY" ]; then
            echo "::warning::BDL_API_KEY not set — collector will fail-open (no snapshot)."
          fi

      # FAIL-OPEN: collector exits 0 on no key / no games / no injuries.
      - name: Collect forward availability snapshot (append-only, pre-tip)
        run: |
          python scripts/collect_availability.py --date "${{ steps.d.outputs.date }}"

      - name: Upload availability snapshot (durable; data/ is gitignored, never committed)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: availability-forward-${{ steps.d.outputs.date }}-${{ github.run_id }}
          path: |
            data/snapshots/availability_forward/**
            artifacts/availability/AVAILABILITY_MANIFEST.json
          if-no-files-found: ignore
          retention-days: 90
