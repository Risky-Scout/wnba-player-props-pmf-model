name: CI — Tests, Feature Variance Gate, CLV Backtest

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ---------------------------------------------------------------------------
  # Permanent actionlint gate — catches workflow YAML/expression syntax errors
  # on every push and PR. Regression proof: pregame_initial.yml was fixed in
  # hotfix/pregame-workflow-yaml (missing 10-space indentation on heredoc
  # content caused GitHub "Invalid workflow file" on line 269).
  # ---------------------------------------------------------------------------
  lint-workflows:
    name: Lint GitHub Actions workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install actionlint
        run: |
          bash <(curl -s https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash) 1.7.7
          sudo mv actionlint /usr/local/bin/actionlint
          actionlint -version
      - name: Run actionlint
        run: actionlint -shellcheck= -pyflakes= .github/workflows/*.yml .github/workflows/*.yaml 2>/dev/null || actionlint -shellcheck= -pyflakes= .github/workflows/*.yml

  # ---------------------------------------------------------------------------
  # Unit + integration tests (existing 691 tests)
  # ---------------------------------------------------------------------------
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest tests/ -q --tb=short --ignore=tests/test_elite_projection_gate.py

  # ---------------------------------------------------------------------------
  # Path B/A MANDATORY pre-merge acceptance gate (MARKET_DISLOCATION).
  # Runs the deterministic OFFLINE fixture scan (no live odds) to produce a real
  # LIVE_SCAN_AUDIT.json exercising every rejection path, then fails the build
  # (exit non-zero) unless the audit satisfies all 10 acceptance requirements.
  # ---------------------------------------------------------------------------
  path_b_acceptance_gate:
    name: Path B/A acceptance gate (MARKET_DISLOCATION)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Run offline fixture scan (deterministic, no live odds)
        run: |
          PYTHONPATH=$(pwd)/src python -m pytest tests/test_path_b_gate_and_scan.py \
            tests/test_path_a_availability_audit.py -q
          PYTHONPATH=$(pwd)/src python scripts/path_b_fixture_scan.py \
            --out-dir artifacts/path_b_fixture

      - name: MANDATORY acceptance gate (fail closed)
        run: |
          PYTHONPATH=$(pwd)/src python scripts/path_b_acceptance_gate.py \
            artifacts/path_b_fixture/LIVE_SCAN_AUDIT.json \
            --report-out artifacts/path_b_fixture/GATE_REPORT.json

      - name: Upload Path B fixture audit + gate report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: path-b-gate-${{ github.run_id }}
          path: artifacts/path_b_fixture/
          retention-days: 30

  # ---------------------------------------------------------------------------
  # R5.2 — Feature variance gate (Blueprint R5)
  # Fails CI if any model feature has cross-player std < 0.05.
  # Requires wide features + manifest from a previous pipeline run.
  # ---------------------------------------------------------------------------
  feature_variance_gate:
    runs-on: ubuntu-latest
    needs: [unit-tests]
    # Only run when processed features exist (skipped on fresh checkouts)
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install package
        run: pip install -e ".[dev]"

      # CERTIFIED mode (push to main, or repo var CERTIFIED_CI=true) MUST fail closed on any
      # missing required artifact. In non-certified dev (PR/branch) the download may be absent and
      # the gate is skipped with an explicit NON-CERTIFIED label (never a silent pass).
      # Phase 3E: fetch required feature artifacts from the IMMUTABLE, hash-pinned data release
      # (config/data_registry.json, sha256-verified) instead of an expiring same-run Actions
      # artifact — a same-run `actions/download-artifact` can NEVER exist on a push event, which is
      # why certified main previously failed. In non-certified dev the fetch may be absent and the
      # gate is skipped (explicitly labeled); certified mode fails closed in the gate step below.
      - name: Fetch immutable feature artifacts (hash-pinned release)
        continue-on-error: ${{ github.ref != 'refs/heads/main' && vars.CERTIFIED_CI != 'true' }}
        env:
          PRIVATE_DATA_GH_TOKEN: ${{ secrets.PRIVATE_DATA_GH_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/fetch_data.py wnba_player_game_features_wide feature_schema_manifest

      - name: Feature variance gate
        env:
          CERTIFIED: ${{ github.ref == 'refs/heads/main' || vars.CERTIFIED_CI == 'true' }}
        run: |
          if [ ! -f "data/processed/feature_schema_manifest.json" ] || \
             [ ! -f "data/processed/wnba_player_game_features_wide.parquet" ]; then
            if [ "$CERTIFIED" = "true" ]; then
              echo "::error::CERTIFIED MODE: required feature artifacts (processed-features-latest / model-stage4-latest) are absent — failing closed"
              exit 1
            fi
            echo "::warning::NON-CERTIFIED dev path: feature artifacts not available — skipping variance gate (this is NOT a certified pass)"
            exit 0
          fi
          python -m wnba_props_model.features.feature_contract audit-variance \
            --features-path data/processed/wnba_player_game_features_wide.parquet \
            --manifest-path data/processed/feature_schema_manifest.json \
            --min-std 0.05 \
            --fail-on-violation

  # ---------------------------------------------------------------------------
  # R6.3 — CLV backtest (Blueprint R6)
  # Checks whether historical model edges beat market close ≥ 75% of the time.
  # Only runs on pushes to main (requires historical delivery data).
  # ---------------------------------------------------------------------------
  clv_backtest:
    runs-on: ubuntu-latest
    needs: [feature_variance_gate]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Download delivery data
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: daily-delivery-latest
          path: data/delivery
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run CLV backtest
        run: |
          python scripts/backtest_clv.py \
            --comparisons-dir data/delivery/ \
            --out artifacts/audits/clv_backtest.json

      - name: Upload CLV backtest results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: clv-backtest-${{ github.run_id }}
          path: artifacts/audits/clv_backtest.json
          retention-days: 30
